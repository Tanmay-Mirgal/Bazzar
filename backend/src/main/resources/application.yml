server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bazzar-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bazzar}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000        # 10 minutes (Neon closes idle connections)
      idle-timeout: 300000        # 5 minutes
      connection-timeout: 20000   # 20 seconds
      minimum-idle: 2
      maximum-pool-size: 10
      keepalive-time: 120000      # 2 minutes keepalive probe
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  # Clerk JWT validation via JWKS (OAuth2 Resource Server)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CLERK_JWKS_URL:https://clerk.bazzar.dev/.well-known/jwks.json}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from-name: ${MAIL_FROM_NAME:Bazzar Marketplace}
    from-email: ${MAIL_FROM_EMAIL:${MAIL_USERNAME:no-reply@bazzar.com}}

# Clerk configuration
clerk:
  jwks-url: ${CLERK_JWKS_URL:https://clerk.bazzar.dev/.well-known/jwks.json}
  webhook-secret: ${CLERK_WEBHOOK_SECRET:whsec_placeholder}

# Cloudinary configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Razorpay configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}

# Shiprocket configuration
shiprocket:
  email: ${SHIPROCKET_EMAIL:}
  password: ${SHIPROCKET_PASSWORD:}

logging:
  level:
    com.bazzar: INFO
    org.springframework.security: WARN
